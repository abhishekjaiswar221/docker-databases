services:
  # MySQL
  mysql:
    image: mysql:8.0
    container_name: dev-mysql
    profiles: ["mysql"]
    mem_limit: 400m
    cpus: 0.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devdb}
      MYSQL_USER: ${MYSQL_USER:-devuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - mysql-network
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-adminer:
    image: adminer:4
    container_name: dev-adminer-mysql
    profiles: ["mysql"]
    restart: unless-stopped
    ports:
      - "9090:8080"
    networks:
      - mysql-network
    depends_on:
      mysql:
        condition: service_healthy

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: dev-postgres
    profiles: ["postgres"]
    mem_limit: 350m
    cpus: 0.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-devdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - postgres-network
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-adminer:
    image: adminer:4
    container_name: dev-adminer-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "9091:8080"
    networks:
      - postgres-network
    depends_on:
      postgres:
        condition: service_healthy

  # MongoDB
  mongo:
    image: mongo:7.0-jammy
    container_name: dev-mongo
    profiles: ["mongo"]
    mem_limit: 500m
    cpus: 0.5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-root}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - mongo-network
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongo-express:
    image: mongo-express:1
    container_name: dev-mongo-express
    profiles: ["mongo"]
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-root}
      ME_CONFIG_MONGODB_SERVER: mongo
    ports:
      - "9092:8081"
    networks:
      - mongo-network
    depends_on:
      mongo:
        condition: service_healthy

  # Redis
  redis:
    image: redis:8-alpine
    container_name: dev-redis
    profiles: ["redis"]
    mem_limit: 200m
    cpus: 0.25
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - redis-network
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: dev-redis-commander
    profiles: ["redis"]
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "9093:8081"
    networks:
      - redis-network
    depends_on:
      redis:
        condition: service_healthy

networks:
  mysql-network:
    name: mysql-network
  postgres-network:
    name: postgres-network
  mongo-network:
    name: mongo-network
  redis-network:
    name: redis-network
